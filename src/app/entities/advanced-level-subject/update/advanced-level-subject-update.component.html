<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-advanced-level-subject-heading" data-cy="AdvancedLevelSubjectCreateUpdateHeading">
        Create or edit a Advanced Level Subject
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id">Id</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_subjectName">Subject Name</label>
          <input
            type="text"
            class="form-control"
            name="subjectName"
            id="field_subjectName"
            data-cy="subjectName"
            formControlName="subjectName"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_grade">Grade</label>
          <input type="text" class="form-control" name="grade" id="field_grade" data-cy="grade" formControlName="grade" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_advancedLevelQualification">Advanced Level Qualification</label>
          <select
            class="form-control"
            id="field_advancedLevelQualification"
            data-cy="advancedLevelQualification"
            name="advancedLevelQualification"
            formControlName="advancedLevelQualification"
            [compareWith]="compareAdvancedLevelQualification"
          >
            <option [ngValue]="null"></option>
            @for (advancedLevelQualificationOption of advancedLevelQualificationsSharedCollection; track $index) {
              <option [ngValue]="advancedLevelQualificationOption">{{ advancedLevelQualificationOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
