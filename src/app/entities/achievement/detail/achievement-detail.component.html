<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (achievement(); as achievementRef) {
      <div>
        <h2 data-cy="achievementDetailsHeading"><span>Achievement</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>Id</span></dt>
          <dd>
            <span>{{ achievementRef.id }}</span>
          </dd>
          <dt><span>Description</span></dt>
          <dd>
            <span>{{ achievementRef.description }}</span>
          </dd>
          <dt><span>Applicant</span></dt>
          <dd>
            @if (achievement()!.applicant) {
              <div>
                <a [routerLink]="['/applicant', achievement()!.applicant?.id, 'view']">{{ achievementRef.applicant?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/achievement', achievementRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
