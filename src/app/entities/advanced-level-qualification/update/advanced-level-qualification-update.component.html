<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-advanced-level-qualification-heading" data-cy="AdvancedLevelQualificationCreateUpdateHeading">
        Create or edit a Advanced Level Qualification
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id">Id</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_examYear">Exam Year</label>
          <input type="number" class="form-control" name="examYear" id="field_examYear" data-cy="examYear" formControlName="examYear" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_indexNumber">Index Number</label>
          <input
            type="text"
            class="form-control"
            name="indexNumber"
            id="field_indexNumber"
            data-cy="indexNumber"
            formControlName="indexNumber"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_stream">Stream</label>
          <input type="text" class="form-control" name="stream" id="field_stream" data-cy="stream" formControlName="stream" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_medium">Medium</label>
          <input type="text" class="form-control" name="medium" id="field_medium" data-cy="medium" formControlName="medium" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_zScore">Z Score</label>
          <input type="number" class="form-control" name="zScore" id="field_zScore" data-cy="zScore" formControlName="zScore" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_applicant">Applicant</label>
          <select
            class="form-control"
            id="field_applicant"
            data-cy="applicant"
            name="applicant"
            formControlName="applicant"
            [compareWith]="compareApplicant"
          >
            <option [ngValue]="null"></option>
            @for (applicantOption of applicantsSharedCollection; track $index) {
              <option [ngValue]="applicantOption">{{ applicantOption.id }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
