<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-voucher-heading" data-cy="VoucherCreateUpdateHeading">Create or edit a Voucher</h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        <div class="mb-3">
          <label class="form-label" for="field_code">Code</label>
          <input type="text" class="form-control" name="code" id="field_code" data-cy="code" formControlName="code" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_receiptDate">Receipt Date</label>
          <div class="d-flex">
            <input
              id="field_receiptDate"
              data-cy="receiptDate"
              type="datetime-local"
              class="form-control"
              name="receiptDate"
              formControlName="receiptDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_customerName">Customer Name</label>
          <input
            type="text"
            class="form-control"
            name="customerName"
            id="field_customerName"
            data-cy="customerName"
            formControlName="customerName"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_customerAddress">Customer Address</label>
          <input
            type="text"
            class="form-control"
            name="customerAddress"
            id="field_customerAddress"
            data-cy="customerAddress"
            formControlName="customerAddress"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_totalAmount">Total Amount</label>
          <input
            type="number"
            class="form-control"
            name="totalAmount"
            id="field_totalAmount"
            data-cy="totalAmount"
            formControlName="totalAmount"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_totalAmountInWord">Total Amount In Word</label>
          <input
            type="text"
            class="form-control"
            name="totalAmountInWord"
            id="field_totalAmountInWord"
            data-cy="totalAmountInWord"
            formControlName="totalAmountInWord"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_comments">Comments</label>
          <input type="text" class="form-control" name="comments" id="field_comments" data-cy="comments" formControlName="comments" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_lmu">Lmu</label>
          <input type="number" class="form-control" name="lmu" id="field_lmu" data-cy="lmu" formControlName="lmu" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_lmd">Lmd</label>
          <div class="d-flex">
            <input
              id="field_lmd"
              data-cy="lmd"
              type="datetime-local"
              class="form-control"
              name="lmd"
              formControlName="lmd"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_termId">Term Id</label>
          <input type="number" class="form-control" name="termId" id="field_termId" data-cy="termId" formControlName="termId" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_term">Term</label>
          <input type="text" class="form-control" name="term" id="field_term" data-cy="term" formControlName="term" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_date">Date</label>
          <div class="d-flex">
            <input
              id="field_date"
              data-cy="date"
              type="datetime-local"
              class="form-control"
              name="date"
              formControlName="date"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_amount">Amount</label>
          <input type="number" class="form-control" name="amount" id="field_amount" data-cy="amount" formControlName="amount" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_checkDate">Check Date</label>
          <div class="d-flex">
            <input
              id="field_checkDate"
              data-cy="checkDate"
              type="datetime-local"
              class="form-control"
              name="checkDate"
              formControlName="checkDate"
              placeholder="YYYY-MM-DD HH:mm"
            />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_checkNo">Check No</label>
          <input type="text" class="form-control" name="checkNo" id="field_checkNo" data-cy="checkNo" formControlName="checkNo" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_bank">Bank</label>
          <input type="text" class="form-control" name="bank" id="field_bank" data-cy="bank" formControlName="bank" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_depBank">Dep Bank</label>
          <input type="text" class="form-control" name="depBank" id="field_depBank" data-cy="depBank" formControlName="depBank" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_bankId">Bank Id</label>
          <input type="number" class="form-control" name="bankId" id="field_bankId" data-cy="bankId" formControlName="bankId" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_branch">Branch</label>
          <input type="text" class="form-control" name="branch" id="field_branch" data-cy="branch" formControlName="branch" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_customerId">Customer Id</label>
          <input
            type="number"
            class="form-control"
            name="customerId"
            id="field_customerId"
            data-cy="customerId"
            formControlName="customerId"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_isActive">Is Active</label>
          <input type="checkbox" class="form-check" name="isActive" id="field_isActive" data-cy="isActive" formControlName="isActive" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_deposited">Deposited</label>
          <input type="checkbox" class="form-check" name="deposited" id="field_deposited" data-cy="deposited" formControlName="deposited" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_createdBy">Created By</label>
          <input type="number" class="form-control" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_amountNo">Amount No</label>
          <input type="number" class="form-control" name="amountNo" id="field_amountNo" data-cy="amountNo" formControlName="amountNo" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_refNo">Ref No</label>
          <input type="text" class="form-control" name="refNo" id="field_refNo" data-cy="refNo" formControlName="refNo" />
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_depAmount">Dep Amount</label>
          <input type="number" class="form-control" name="depAmount" id="field_depAmount" data-cy="depAmount" formControlName="depAmount" />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span>Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
