<form [formGroup]="categoryForm">
  <!-- Parent Category Dropdown -->
  <div class="text-lg text-gray-600 mt-2">
  <strong>Create Account type:</strong> 
</div>

<br>
<mat-form-field appearance="outline" class="w-full">
  <mat-label>Account type</mat-label>
  <input
    type="text"
    matInput
    [formControl]="categoryForm.controls.parentCategory"
    [matAutocomplete]="auto"
    placeholder="Category"
  />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayCategory">
    <mat-option *ngFor="let cat of filteredCategories | async" [value]="cat">
      {{ cat.lmu }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>


  <!-- Category Name Input -->
  <mat-form-field appearance="outline" class="w-full">
    <mat-label> Account code</mat-label>
     <mat-error *ngIf="categoryForm.get('name')?.hasError('outOfRange')">
    Account code must be between {{
      categoryForm.get('name')?.getError('outOfRange').min
    }} and {{
      categoryForm.get('name')?.getError('outOfRange').max
    }} for this account type.
  </mat-error>
    <input matInput formControlName="name" placeholder="Enter account code" />
  </mat-form-field>

  <!-- Save Button -->
  <div class="flex justify-end mt-4">
    <button mat-raised-button color="primary" (click)="onSave()">
      <mat-icon>save</mat-icon>
      Save type
    </button>
  </div>
</form>
