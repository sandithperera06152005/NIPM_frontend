<div class="absolute inset-0 flex min-w-0 flex-col overflow-hidden">

    <!-- Header Section -->
    <div
        class="bg-default flex flex-0 flex-col p-6 pb-22 dark:bg-transparent sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:pb-12 sm:pt-12">
        <div class="min-w-0 flex-1">
            <h2 class="truncate text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl">
                Vouchers
            </h2>
        </div>

        <!-- Actions Section -->
        <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
            <!-- Toggle Buttons -->
            <div class="flex gap-2 mr-4">
                <button (click)="searchByCode = true; showDateRange = false"
                    [class.bg-amber-400]="searchByCode && !showDateRange"
                    [class.bg-gray-300]="!searchByCode || showDateRange"
                    class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400"
                    aria-label="Search by Code">
                    <div
                        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
                        <mat-icon class="text-2xl" [svgIcon]="'mat_outline:qr_code_scanner'"></mat-icon>
                    </div>
                </button>

                <button (click)="showDateRange = !showDateRange"
                    class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400"
                    [class.bg-amber-400]="showDateRange" [class.bg-gray-300]="!showDateRange"
                    aria-label="Toggle Date Filter">
                    <div
                        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
                        <mat-icon class="text-2xl" [svgIcon]="'mat_outline:calendar_today'"></mat-icon>
                    </div>
                </button>

                <!-- Refresh Button -->
                <button (click)="refreshFilters()"
                    class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400 bg-gray-300"
                    aria-label="Refresh Filters" title="Clear filters and reload">
                    <div
                        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
                        <mat-icon class="text-2xl" svgIcon="mat_outline:refresh"></mat-icon>
                    </div>
                </button>
            </div>

            <!-- Search Input or Date Range Picker -->
            <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
                <ng-container *ngIf="!showDateRange; else dateRangePicker">
                    <mat-icon class="icon-size-5" matPrefix
                        [svgIcon]="searchByCode ? 'mat_outline:qr_code_scanner' : 'heroicons_solid:magnifying-glass'"></mat-icon>
                    <span matPrefix *ngIf="searchByCode" class="pl-3">VCHR&nbsp;</span>
                    <input matInput [placeholder]="searchByCode ? 'Search by Code' : 'Search by Name'"
                        [ngModel]="searchByCode ? codeInput : filter.name" (ngModelChange)="onCodeChange($event)"
                        (focus)="onCodeFocus()" (keydown.enter)="onFilterChange()" autocomplete="off" />
                </ng-container>

                <ng-template #dateRangePicker>
                    <mat-date-range-input [rangePicker]="rangePicker">
                        <input matStartDate placeholder="From date" [ngModel]="filter.dateRange.start"
                            (ngModelChange)="filter.dateRange.start = $event; onDateChange()" />
                        <input matEndDate placeholder="To date" [ngModel]="filter.dateRange.end"
                            (ngModelChange)="filter.dateRange.end = $event; onDateChange()" />
                    </mat-date-range-input>
                    <mat-datepicker-toggle matSuffix [for]="rangePicker"></mat-datepicker-toggle>
                    <mat-datepicker #rangePicker></mat-datepicker>
                </ng-template>
            </mat-form-field>

            <!-- Search Button -->
            <button mat-flat-button color="primary" (click)="onFilterChange()" class="ml-3">
                <mat-icon class="icon-size-4" [svgIcon]="'heroicons_mini:magnifying-glass'"></mat-icon>
                <span class="ml-2">Search</span>
            </button>

            <!-- Create Button -->
            <button class="ml-3" mat-flat-button color="primary" (click)="openVoucherCreateDialog()">
                <mat-icon class="icon-size-4" [svgIcon]="'heroicons_mini:plus'"></mat-icon>
                <span class="ml-2">Create Voucher</span>
            </button>
        </div>
    </div>

    <!-- Table Container -->
    <div class="flex-1 overflow-auto">
        <table mat-table [dataSource]="uniqueVouchers" matSort class="min-w-full border">

            <!-- Voucher ID -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header
                          class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 pl-10 font-semibold">
                    ID
                </th>
                <td mat-cell *matCellDef="let voucher" class="px-4 py-2 pr-50 pl-10">{{ voucher.id }}</td>
            </ng-container>

            <!-- Code -->
            <ng-container matColumnDef="code">
                <th mat-header-cell *matHeaderCellDef mat-sort-header
                    class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 text-left font-semibold">
                    Code
                </th>
                <td mat-cell *matCellDef="let voucher" class="px-4 py-2 pr-50">{{ voucher.code }}</td>
            </ng-container>


            <!-- Total Amount -->
            <ng-container matColumnDef="totalAmount">
                <th mat-header-cell *matHeaderCellDef mat-sort-header
                    class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 text-left font-semibold">
                    Amount
                </th>
                <td mat-cell *matCellDef="let voucher" class="px-4 py-2 pr-50">{{ voucher.totalAmount | number:'1.2-2' }}</td>
            </ng-container>


            <!-- Actions -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let voucher">
                    <div class="flex space-x-2">
                        <button mat-flat-button color="primary" (click)="viewVoucher(voucher.id)">View Voucher</button>
                        <button mat-flat-button color="warn" (click)="deleteVoucher(voucher.id)">Delete</button>
                    </div>
                </td>
            </ng-container>

            <!-- Table Rows -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </div>

    <!-- Paginator -->
    <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageIndex]="currentPage - 1"
        [pageSizeOptions]="[5, 10, 20]" (page)="onPaginateChange($event)"></mat-paginator>
</div>
