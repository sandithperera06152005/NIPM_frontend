<div class="absolute inset-0 flex min-w-0 flex-col overflow-hidden">

  <!-- Header Section -->
  <div
    class="bg-default flex flex-0 flex-col p-6 pb-22 dark:bg-transparent sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:pb-28 sm:pt-12">
    <div class="min-w-0 flex-1">
      <!-- Title -->
      <h2 class="truncate text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl">
        Bank Accounts
      </h2>
    </div>

    <!-- Actions Section -->
    <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">

      <!-- Toggle Buttons -->
      <div class="flex gap-2 mr-4">

        <!-- Account Number Button -->
        <button (click)="setSearchMode('accountNumber')" [class.bg-amber-400]="searchMode === 'accountNumber'"
          [class.bg-gray-300]="searchMode !== 'accountNumber'"
          class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400"
          aria-label="Search by Account Number" title="Search by Account Number">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
            <mat-icon class="text-2xl" svgIcon="mat_outline:tag"></mat-icon>
          </div>
        </button>

        <!-- Account Name Button -->
        <button (click)="setSearchMode('accountName')" [class.bg-amber-400]="searchMode === 'accountName'"
          [class.bg-gray-300]="searchMode !== 'accountName'"
          class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400" aria-label="Search by Account Name"
          title="Search by Account Name">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
            <mat-icon class="text-2xl" svgIcon="heroicons_outline:user-circle"></mat-icon>
          </div>
        </button>

        <!-- Bank Name Button -->
        <button (click)="setSearchMode('bankName')" [class.bg-amber-400]="searchMode === 'bankName'"
          [class.bg-gray-300]="searchMode !== 'bankName'"
          class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400" aria-label="Search by Bank Name"
          title="Search by Bank Name">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
            <mat-icon class="text-2xl" svgIcon="mat_outline:account_balance"></mat-icon>
          </div>
        </button>

        <!-- Refresh Button -->
        <button (click)="clearFilters()"
          class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400 bg-gray-300"
          aria-label="Refresh Filters" title="Clear filters and reload">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50">
            <mat-icon class="text-2xl" svgIcon="mat_outline:refresh"></mat-icon>
          </div>
        </button>
      </div>

      <!-- Search Input -->
      <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
        <mat-icon matPrefix svgIcon="mat_outline:search"></mat-icon>
        <input matInput [placeholder]="getSearchPlaceholder()" [(ngModel)]="searchText" (input)="onSearch()"
          autocomplete="off" />
      </mat-form-field>

      <!-- Search Button -->
      <!-- <button mat-flat-button color="primary" (click)="onSearch()" class="ml-3">
        <mat-icon class="icon-size-4" svgIcon="heroicons_mini:magnifying-glass"></mat-icon>
        <span class="ml-2">Search</span>
      </button> -->

      <!-- Create Button -->
      <button mat-flat-button color="accent" (click)="createAccount()" class="ml-3">
        <mat-icon class="icon-size-4" svgIcon="mat_outline:add"></mat-icon>
        <span class="ml-2">Create</span>
      </button>

    </div>

  </div>

  <!-- Table Container -->
  <div class="example-table-container bg-card -mt-16 h-full rounded-t-2xl shadow overflow-auto"
    style="min-height: 0; max-height: 6020px;">
    <div class="flex flex-col flex-auto sm:mb-18">

      <table mat-table [dataSource]="bankAccounts" matSort
        class="w-full table-fixed border-separate border-spacing-y-2">
        <!-- Account Number -->
        <ng-container matColumnDef="accountNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 text-left font-semibold pl-8">
            Account Number
          </th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2 pl-8">
            {{ element.accountNumber }}
          </td>
        </ng-container>

        <!-- Account Name -->
        <ng-container matColumnDef="accountName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Account Name</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.accountName }}</td>
        </ng-container>

        <!-- Bank Name -->
        <ng-container matColumnDef="bankName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Bank Name</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.bankName }}</td>
        </ng-container>

        <!-- Branch Name -->
        <ng-container matColumnDef="branchName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Branch Name</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.branchName }}</td>
        </ng-container>

        <!-- Amount -->
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Amount</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.amount | number:'1.2-2' }}</td>
        </ng-container>

        <!-- Account Code -->
        <ng-container matColumnDef="accountCode">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Account Code</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.accountCode }}</td>
        </ng-container>

        <!-- Account Type -->
        <ng-container matColumnDef="accountTypeId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Type</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.lmu }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef
            class="sticky top-0 z-10 bg-white dark:bg-gray-900 px-4 py-3 font-semibold">Actions</th>
          <td mat-cell *matCellDef="let element" class="px-4 py-2 flex gap-2">
            <!-- <button mat-icon-button color="primary" (click)="editAccount(element)">
              <mat-icon svgIcon="mat_outline:edit"></mat-icon>
            </button> -->
            <button mat-icon-button color="warn" (click)="deleteAccount(element.id!)">
              <mat-icon svgIcon="mat_outline:delete"></mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Header and Row Definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>

  <!-- Paginator -->
  <mat-paginator [pageSizeOptions]="[5, 10, 20]">
  </mat-paginator>

</div>
