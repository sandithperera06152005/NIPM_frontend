<!-- Reusable form component template -->
<form class="flex h-full flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="flex items-center justify-between border-b pb-4">
    <h2 class="text-2xl font-bold">
      {{ heading || (isEditMode ? 'Edit MembershipCategory' : 'New MembershipCategory') }}
    </h2>
    <mat-icon *ngIf="isSaving" class="animate-spin">autorenew</mat-icon>
  </div>

  <div class="flex-auto space-y-4 overflow-y-auto pt-6">
    
      
    <mat-form-field class="w-full">
      <mat-label>Membership Number</mat-label>
      <input matInput formControlName="membershipNumber" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Membership Name</mat-label>
      <input matInput formControlName="membershipName" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Starting Date</mat-label>
      <input matInput [matDatepicker]="pickerstartDate" formControlName="startDate">
      <mat-datepicker-toggle matSuffix [for]="pickerstartDate"></mat-datepicker-toggle>
      <mat-datepicker #pickerstartDate></mat-datepicker>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Ending Date</mat-label>
      <input matInput [matDatepicker]="pickerendDate" formControlName="endDate">
      <mat-datepicker-toggle matSuffix [for]="pickerendDate"></mat-datepicker-toggle>
      <mat-datepicker #pickerendDate></mat-datepicker>
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Duration</mat-label>
      <input matInput formControlName="duration" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Price</mat-label>
      <input matInput formControlName="price" >
    </mat-form-field>
      
    
      
    <mat-form-field class="w-full">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option *ngFor="let option of membershipStatusOptions" [value]="option">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field>
      
    

    
    
  </div>

  <div *ngIf="errorMessage" class="mt-2 rounded bg-warn-100 px-4 py-2 text-warn-900">
    {{ errorMessage }}
  </div>

  <div class="mt-6 flex items-center justify-end border-t pt-6">
    <button type="button" mat-button (click)="onCancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" class="ml-3" [disabled]="form.invalid || isSaving">
      <span *ngIf="!isSaving">Save</span>
      <span *ngIf="isSaving">Saving…</span>
    </button>
  </div>
</form>
