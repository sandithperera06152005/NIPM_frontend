<!-- Reusable form component template -->
<form class="flex h-full flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="flex items-center justify-between border-b pb-4">
    <h2 class="text-2xl font-bold">
      {{ heading || (isEditMode ? 'Edit StudentProfile' : 'New StudentProfile') }}
    </h2>
    <mat-icon *ngIf="isSaving" class="animate-spin">autorenew</mat-icon>
  </div>

  <div class="flex-auto space-y-4 overflow-y-auto pt-6">


    <mat-form-field class="w-full">
      <mat-label>StudentNumber</mat-label>
      <input matInput formControlName="studentNumber">
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Student Name</mat-label>
      <input matInput formControlName="studentName">
    </mat-form-field>



    <mat-form-field class="w-full">
      <mat-label>Nic</mat-label>
      <input matInput formControlName="nic">
    </mat-form-field>



    <mat-form-field class="w-full">
      <mat-label>DateOfBirth</mat-label>
      <input matInput [matDatepicker]="pickerdateOfBirth" formControlName="dateOfBirth">
      <mat-datepicker-toggle matSuffix [for]="pickerdateOfBirth"></mat-datepicker-toggle>
      <mat-datepicker #pickerdateOfBirth></mat-datepicker>
    </mat-form-field>



    <mat-form-field class="w-full">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address">
    </mat-form-field>



    <mat-form-field class="w-full">
      <mat-label>EnrollmentStatus</mat-label>
      <mat-select formControlName="enrollmentStatus">
        <mat-option *ngFor="let option of enrollmentStatusOptions" [value]="option">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field>



    <mat-form-field class="w-full">
      <mat-label>CreatedAt</mat-label>
      <input matInput [matDatepicker]="pickercreatedAt" formControlName="createdAt">
      <mat-datepicker-toggle matSuffix [for]="pickercreatedAt"></mat-datepicker-toggle>
      <mat-datepicker #pickercreatedAt></mat-datepicker>
    </mat-form-field>





  </div>

  <div *ngIf="errorMessage" class="mt-2 rounded bg-warn-100 px-4 py-2 text-warn-900">
    {{ errorMessage }}
  </div>

  <div class="mt-6 flex items-center justify-end border-t pt-6">
    <button type="button" mat-button (click)="onCancel()">Cancel</button>
    <button type="submit" mat-flat-button color="primary" class="ml-3" [disabled]="form.invalid || isSaving">
      <span *ngIf="!isSaving">Save</span>
      <span *ngIf="isSaving">Saving…</span>
    </button>
  </div>
</form>
