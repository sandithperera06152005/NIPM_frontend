<div class="absolute inset-0 flex min-w-0 flex-col overflow-hidden">
  <!-- Header -->
  <div
  class="bg-default flex flex-0 flex-col p-6 pb-22 dark:bg-transparent sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:pb-12 sm:pt-12">
  <div class="min-w-0 flex-1">
    <h2
      class="truncate text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl pb-5">
      Vendor Payments
    </h2>
  </div>

  <!-- Toggle Buttons for Search Mode -->
  <div class="flex gap-2 mr-4">
    <!-- GRN Code -->
    <button
      (click)="setSearchMode('grnCode')"
      [class.bg-amber-400]="searchMode === 'grnCode'"
      [class.bg-gray-300]="searchMode !== 'grnCode'"
      class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400"
      aria-label="Search by GRN Code"
      title="Search by GRN Code"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50"
      >
        <mat-icon class="text-2xl" svgIcon="mat_outline:qr_code_scanner"></mat-icon>
      </div>
    </button>

    <!-- Supplier Invoice Code -->
    <button
      (click)="setSearchMode('supplierInvoiceCode')"
      [class.bg-amber-400]="searchMode === 'supplierInvoiceCode'"
      [class.bg-gray-300]="searchMode !== 'supplierInvoiceCode'"
      class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400"
      aria-label="Search by Supplier Invoice Code"
      title="Search by Supplier Invoice Code"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50"
      >
        <mat-icon class="text-2xl" svgIcon="mat_outline:receipt_long"></mat-icon>
      </div>
    </button>

    <!-- Supplier Name -->
    <button
      (click)="setSearchMode('supplierName')"
      [class.bg-amber-400]="searchMode === 'supplierName'"
      [class.bg-gray-300]="searchMode !== 'supplierName'"
      class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400"
      aria-label="Search by Supplier Name"
      title="Search by Supplier Name"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50"
      >
        <mat-icon class="text-2xl" svgIcon="heroicons_outline:user-circle"></mat-icon>
      </div>
    </button>

    <!-- Refresh -->
    <button
      (click)="refreshFilters()"
      class="px-2 py-2 text-white rounded-xl transition-all hover:bg-amber-400 bg-gray-300"
      aria-label="Refresh Filters"
      title="Clear filters and reload"
    >
      <div
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-100 text-indigo-800 dark:bg-indigo-600 dark:text-indigo-50"
      >
        <mat-icon class="text-2xl" svgIcon="mat_outline:refresh"></mat-icon>
      </div>
    </button>
  </div>

  <!-- Search Field -->
  <div class="mt-6 flex shrink-0 items-center sm:ml-7 sm:mt-0">
    <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64 mt-4 self-end">
      <mat-icon matPrefix svgIcon="heroicons_solid:magnifying-glass"></mat-icon>
      <input
        matInput
        [formControl]="searchInputControl"
        [placeholder]="searchPlaceholder"
        (keyup)="searchInvoices()"
        autocomplete="off"
      />
    </mat-form-field>
  </div>
</div>


  <!-- Table -->
  <div class="example-table-container bg-card -mt-6 h-full rounded-t-2xl shadow overflow-hidden">
    <div class="flex flex-col flex-auto h-full">
      <div class="overflow-auto">
        <table mat-table [dataSource]="dataSource" matSort class="w-full table-fixed border-separate border-spacing-y-2 px-6">
          
          <!-- Columns -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <ng-container matColumnDef="grnCode">
            <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">GRN No</th>
            <td mat-cell *matCellDef="let row">{{ row.grnCode }}</td>
          </ng-container>

          <ng-container matColumnDef="supplierName">
            <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">Supplier</th>
            <td mat-cell *matCellDef="let row">{{ row.supplierName }}</td>
          </ng-container>

          <ng-container matColumnDef="supplierInvoiceCode">
            <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">Invoice Code</th>
            <td mat-cell *matCellDef="let row">{{ row.supplierInvoiceCode }}</td>
          </ng-container>

          <ng-container matColumnDef="supplierInvoiceDate">
            <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">Invoice Date</th>
            <td mat-cell *matCellDef="let row">{{ row.supplierInvoiceDate | date: 'yyyy-MM-dd' }}</td>
          </ng-container>

          <ng-container matColumnDef="amountInitial">
  <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">GRN Value</th>
  <td mat-cell *matCellDef="let row">{{ row.amountInitial | number:'1.2-2' }}</td>
</ng-container>

<ng-container matColumnDef="amountOwing">
  <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">Amount Owing</th>
  <td mat-cell *matCellDef="let row">{{ row.amountOwing | number:'1.2-2' }}</td>
</ng-container>

          <!-- Payment Input -->
        <ng-container matColumnDef="paymentAmount">
          <th mat-header-cell *matHeaderCellDef class="sticky top-0 bg-white z-10">
            <div class="flex items-center justify-between">
              <button
                mat-flat-button
                color="primary"
                class="ml-4"
                (click)="onAddAmountClick()"
              >
                Add Amount
              </button>
            </div>
          </th>
          <td mat-cell *matCellDef="let invoice">
            <mat-form-field appearance="outline" class="w-40">
              <input
                matInput
                type="number"
                placeholder="Enter amount"
                [(ngModel)]="invoice.enteredAmount"
              />
            </mat-form-field>
          </td>
        </ng-container>

          <!--<ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let row">
              <button mat-flat-button color="primary" (click)="markAsPaid(row.id)">Mark as Paid</button>
            </td>
          </ng-container>-->

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
  </div>

    <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageIndex]="currentPage - 1"
      [pageSizeOptions]="[5, 10, 20]" (page)="onPaginateChange($event)">
    </mat-paginator>


</div>
