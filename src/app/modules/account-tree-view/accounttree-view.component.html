<h2 mat-dialog-title class="dialog-title">
    Select Account
    <button mat-icon-button class="close-btn" (click)="close()">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<mat-dialog-content class="dialog-content">

    <!-- Main account buttons -->
    <div class="main-buttons">
        <button *ngFor="let acc of mainAccounts" mat-raised-button color="primary"
            (click)="onMainAccountClick(acc.key)">
            {{ acc.label }}
        </button>
    </div>

    <!-- Tree -->
    <div class="tree-section" *ngIf="treeData.length">

        <mat-tree [dataSource]="treeData" [childrenAccessor]="getChildren" class="account-tree">

            <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
                {{ node.name }} <span *ngIf="node.code">({{ node.code }})</span>
            </mat-tree-node>

            <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding>
                <button mat-icon-button matTreeNodeToggle class="toggle-btn">
                    <mat-icon class="toggle-icon">chevron_right</mat-icon>
                </button>

                {{ node.name }} <span *ngIf="node.code">({{ node.code }})</span>
            </mat-tree-node>

        </mat-tree>

    </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="showAll()">View All</button>
</mat-dialog-actions>
